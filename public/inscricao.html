<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inscrição — LEPV</title>
<link rel="icon" href="/logo-liga.png">
<meta name="theme-color" content="#17171B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<style>
  body { background-color: var(--navy); min-height: 100vh; }
  .stage {
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 32px 16px; position: relative;
  }
  .stage::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image: linear-gradient(rgba(255,255,255,0.06) 1px, transparent 1px),
                       linear-gradient(90deg, rgba(255,255,255,0.06) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse 70% 60% at 50% 30%, black 0%, transparent 75%);
  }
  .brandblock { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 26px; }
  .brandblock img {
    width: 76px; height: 76px; margin-bottom: 16px; border-radius: 50%;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.18), 0 0 24px var(--red-glow);
  }
  .brandblock .eyebrow { color: rgba(255,255,255,0.55); margin-bottom: 10px; }
  .brandblock h1 {
    color: #fff; font-size: 32px; font-weight: 800; text-transform: uppercase;
    letter-spacing: 0.02em; line-height: 1; margin: 0;
  }
  .brandblock .sub { color: rgba(255,255,255,0.6); font-size: 13.5px; margin-top: 10px; }

  .card {
    position: relative; width: 100%; max-width: 420px; background: var(--white);
    border-radius: var(--radius-lg); padding: 28px 22px;
    box-shadow: var(--shadow-lift);
  }
  .card .eyebrow { margin-bottom: 6px; color: var(--graphite-soft); }
  .card h2 { font-size: 19px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.02em; color: var(--navy); margin: 0 0 4px; }
  .lesson-date { font-size: 13px; color: var(--graphite-soft); margin: 0 0 6px; }
  .lesson-desc { font-size: 13px; color: var(--graphite); line-height: 1.55; margin: 0 0 16px; }
  form { display: flex; flex-direction: column; gap: 16px; }
  .error {
    display: none; font-size: 12.5px; color: #991B1B; background: #FEEBEB;
    border: 1px solid #F5C6C6; border-radius: var(--radius-sm); padding: 9px 12px;
  }
  .error.show { display: block; }
  .btn-primary { width: 100%; margin-top: 4px; }
  .done { display: none; text-align: center; padding: 14px 4px 6px; }
  .done.show { display: block; }
  .done .check {
    width: 48px; height: 48px; margin: 0 auto 14px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--good-soft); color: var(--good); font-size: 22px; font-weight: 800;
  }
  .done h3 { font-size: 17px; font-weight: 800; text-transform: uppercase; color: var(--navy); margin: 0 0 8px; }
  .done p { font-size: 13px; color: var(--graphite-soft); line-height: 1.55; margin: 0; }
  .done .invite {
    margin-top: 14px; font-size: 13px; color: var(--navy); background: var(--pending-soft);
    border: 1px solid #F5DFB8; border-radius: var(--radius-sm); padding: 10px 12px; line-height: 1.5;
  }
  .done .invite a { color: var(--red-2); font-weight: 700; }
  .hint { font-size: 11.5px; color: var(--graphite-soft); margin-top: -6px; }
</style>
</head>
<body>
  <div class="stage">
    <div class="brandblock">
      <img src="/logo-liga.png" alt="LEPV" style="background:var(--white); object-fit:cover;">
      <p class="eyebrow">Liga de Empreendedorismo da Praia Vermelha</p>
      <h1>LEPV</h1>
      <p class="sub">Inscrição em aula da liga</p>
    </div>

    <div class="card">
      <div id="lesson-info">
        <p class="eyebrow">Aula</p>
        <h2 id="lesson-title">Carregando...</h2>
        <p class="lesson-date" id="lesson-date"></p>
        <p class="lesson-desc" id="lesson-desc"></p>
      </div>

      <form id="signup-form">
        <div class="field">
          <label for="s-name">Nome completo</label>
          <input type="text" id="s-name" autocomplete="name" placeholder="Nome e sobrenome" required>
        </div>
        <div class="field">
          <label for="s-email">E-mail</label>
          <input type="email" id="s-email" autocomplete="email" placeholder="voce@exemplo.com">
          <p class="hint">Opcional, mas ajuda a liga a te reconhecer nas próximas atividades.</p>
        </div>
        <div class="field">
          <label for="s-phone">WhatsApp</label>
          <input type="tel" id="s-phone" autocomplete="tel" placeholder="(21) 9...." required>
        </div>
        <p class="error" id="s-error"></p>
        <button type="submit" class="btn-primary" id="s-submit">Confirmar inscrição</button>
      </form>

      <div class="done" id="done">
        <div class="check">✓</div>
        <h3>Inscrição confirmada</h3>
        <p id="done-msg"></p>
        <div class="invite">
          Curte o que a LEPV faz? <a href="/login.html">Solicite seu acesso de membro</a> ou fale com a diretoria.
        </div>
      </div>
    </div>
  </div>

<script>
(function () {
  var token = new URLSearchParams(window.location.search).get("t") || "";
  var form = document.getElementById("signup-form");
  var errorEl = document.getElementById("s-error");
  var submitBtn = document.getElementById("s-submit");

  function fail(msg) {
    document.getElementById("lesson-title").textContent = "Link inválido";
    document.getElementById("lesson-date").textContent = msg;
    form.style.display = "none";
  }

  if (!token) {
    fail("Peça o link atualizado a alguém da diretoria.");
  } else {
    fetch("/api/lesson-signup/" + encodeURIComponent(token))
      .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
      .then(function (l) {
        document.getElementById("lesson-title").textContent = l.title;
        var p = String(l.date || "").split("-");
        document.getElementById("lesson-date").textContent =
          (p.length === 3 ? p[2] + "/" + p[1] + "/" + p[0] : "") + (l.open ? "" : " · inscrições encerradas");
        if (l.description) document.getElementById("lesson-desc").textContent = l.description;
        if (!l.open) {
          form.style.display = "none";
          errorEl.textContent = "As inscrições desta aula já foram encerradas.";
          errorEl.classList.add("show");
        }
      })
      .catch(function () { fail("Este link não corresponde a nenhuma aula."); });
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    errorEl.classList.remove("show");
    submitBtn.disabled = true;
    submitBtn.textContent = "Enviando...";
    fetch("/api/lesson-signup/" + encodeURIComponent(token), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        name: document.getElementById("s-name").value,
        email: document.getElementById("s-email").value,
        phone: document.getElementById("s-phone").value,
      }),
    })
      .then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
      .then(function (res) {
        if (res.ok) {
          form.style.display = "none";
          document.getElementById("done").classList.add("show");
          document.getElementById("done-msg").textContent = res.data.message || "Te esperamos na aula!";
        } else {
          errorEl.textContent = res.data.message || "Não foi possível se inscrever. Tente de novo.";
          errorEl.classList.add("show");
          submitBtn.disabled = false;
          submitBtn.textContent = "Confirmar inscrição";
        }
      })
      .catch(function () {
        errorEl.textContent = "Erro de conexão. Tente de novo.";
        errorEl.classList.add("show");
        submitBtn.disabled = false;
        submitBtn.textContent = "Confirmar inscrição";
      });
  });
})();
</script>
</body>
</html>
