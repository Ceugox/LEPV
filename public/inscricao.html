<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inscrição — LEPV</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/logo-mark.png">
<meta name="theme-color" content="#0A0A0B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<style>
  /* Papel claro e gramática de documento, iguais à landing: quem clica em
     "Garantir vaga" lá continua no mesmo lugar aqui. O que muda de página
     para página vive neste bloco; o resto vem de styles.css. */
  body { background-color: var(--paper); }

  /* verbete do evento, no alto da folha */
  .ev-head { margin: 0 0 4px; }
  .ev-head .k {
    display: inline-flex; align-items: center; gap: 8px; margin: 0 0 9px;
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--wine);
  }
  .ev-head h2 {
    font-family: var(--fd); font-weight: 400; text-transform: none;
    font-size: clamp(28px, 4.4vw, 42px); line-height: 1.04; color: var(--ink); margin: 0 0 10px;
  }
  .lesson-date { font-size: 14px; color: var(--ink-3); margin: 0 0 12px; font-variant-numeric: tabular-nums; }
  .lesson-desc { font-size: 15.5px; color: var(--ink-2); line-height: 1.68; margin: 0 0 16px; max-width: 52ch; }
  .seats { font-size: 13px; font-weight: 600; color: var(--wine); margin: 0 0 6px; }
  .seats.full { color: var(--pending); }

  form { display: grid; gap: 16px; margin-top: 26px;
         padding-top: 24px; border-top: 1px solid var(--line); }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label {
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--ink-3);
  }
  .field input, .field select {
    font: inherit; font-size: 16px; color: var(--ink); background: var(--card);
    border: 1px solid var(--line-2); border-radius: 3px; padding: 12px 13px;
    min-height: 48px; transition: border-color .15s, box-shadow .15s;
  }
  .field input:focus, .field select:focus {
    outline: none; border-color: var(--wine); box-shadow: 0 0 0 3px rgba(127,10,26,0.12);
  }
  .field input::placeholder { color: var(--ink-3); }
  .row2 { display: grid; grid-template-columns: 1fr; gap: 16px; }
  @media (min-width: 520px) { .row2 { grid-template-columns: 1fr 1fr } }

  .ack {
    display: flex; align-items: flex-start; gap: 10px; font-size: 14px; line-height: 1.5;
    color: var(--ink-2); cursor: pointer; padding: 3px 0; min-height: 44px;
  }
  .ack input { width: 20px; height: 20px; margin-top: 1px; flex: none;
               font-size: 16px; accent-color: var(--wine); }
  .ack strong { color: var(--ink); font-weight: 600; }
  .hint { font-size: 12px; color: var(--ink-3); margin-top: -8px; }

  .error {
    display: none; font-size: 13px; line-height: 1.55; color: var(--danger);
    background: var(--danger-soft); border: 1px solid var(--danger-line);
    border-radius: 3px; padding: 11px 13px;
  }
  .error.show { display: block; }
  .btn-primary { width: 100%; justify-content: center; }

  /* confirmação: continua sóbria, sem card nem centralização de app */
  .done { display: none; padding: 4px 0 0; }
  .done.show { display: block; }
  /* .check (e nao .done-mark) porque o JS procura por "#done .check" */
  .done .check {
    width: 42px; height: 42px; margin: 0 0 14px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--good-soft); color: var(--good); font-size: 20px; font-weight: 700;
  }
  .done h3 {
    font-family: var(--fd); font-weight: 400; text-transform: none; font-size: 30px;
    line-height: 1.06; color: var(--ink); margin: 0 0 10px;
  }
  .done p { font-size: 15px; color: var(--ink-2); line-height: 1.66; margin: 0; max-width: 52ch; }
  .done .invite {
    margin-top: 18px; font-size: 14px; line-height: 1.6; color: var(--ink-2);
    background: var(--pending-soft); border: 1px solid var(--pending-line);
    border-radius: 3px; padding: 12px 14px;
  }
  .done .invite a { color: var(--wine); font-weight: 600; }
</style>
</head>
<body>
  <!-- Faixa da mesma fotografia da landing: continuidade visual em vez de
       queda numa tela preta. -->
  <header class="page-top">
    <div class="page-top-ph">
      <img src="/assets/praia-vermelha-900.jpg" alt="" aria-hidden="true">
    </div>
    <div class="page-top-in">
      <a class="stamp" href="/" style="text-decoration:none">
        <img src="/assets/logo-mark.png" alt="LEPV">
        <b>Liga de Empreendedorismo da Praia Vermelha<span class="sub">Inscrição em atividade da liga</span></b>
      </a>
    </div>
  </header>

  <div class="rule2"></div>

  <main class="sheet">
    <section class="rv">
      <div class="ev-head" id="lesson-info">
        <p class="k" id="event-kind">Evento</p>
        <h2 id="lesson-title">Carregando...</h2>
        <p class="lesson-date" id="lesson-date"></p>
        <p class="lesson-desc" id="lesson-desc"></p>
        <p class="seats" id="seats"></p>
        <!-- Fora do <form>: com as inscrições encerradas o formulário some e
             este aviso precisa continuar na tela. -->
        <p class="error" id="s-notice"></p>
      </div>

      <form id="signup-form">
        <div class="field">
          <label for="s-name">Nome completo</label>
          <input type="text" id="s-name" autocomplete="name" placeholder="Nome e sobrenome" required>
        </div>
        <div class="field">
          <label for="s-email">E-mail</label>
          <input type="email" id="s-email" autocomplete="email" placeholder="voce@exemplo.com" required>
        </div>
        <div class="field">
          <label for="s-phone">WhatsApp</label>
          <input type="tel" id="s-phone" autocomplete="tel" placeholder="(21) 9...." required>
        </div>
        <div class="row2">
          <div class="field">
            <label for="s-turma">Turma</label>
            <select id="s-turma" required><option value="">Selecione</option></select>
          </div>
          <div class="field">
            <label for="s-idade">Idade</label>
            <input type="number" id="s-idade" min="14" max="99" placeholder="Ex.: 20" required>
          </div>
        </div>
        <div class="field">
          <label for="s-esp">Especialidade</label>
          <select id="s-esp" required><option value="">Selecione</option></select>
        </div>
        <label class="ack">
          <input type="checkbox" id="s-aware-local" required>
          <span>Estou ciente do local<span id="ack-local"></span></span>
        </label>
        <label class="ack">
          <input type="checkbox" id="s-aware-time" required>
          <span>Estou ciente do horário<span id="ack-time"></span></span>
        </label>
        <p class="error" id="s-error"></p>
        <button type="submit" class="btn-primary" id="s-submit">Confirmar inscrição</button>
      </form>

      <div class="done rv" style="--i:2" id="done">
        <div class="check">✓</div>
        <h3>Inscrição confirmada</h3>
        <p id="done-msg"></p>
        <div class="invite">
          Curte o que a LEPV faz? <a href="/login.html">Solicite seu acesso de membro</a> ou fale com a diretoria.
        </div>
      </div>
    </section>
  </main>

<script>
(function () {
  var token = new URLSearchParams(window.location.search).get("t") || "";
  var form = document.getElementById("signup-form");
  var errorEl = document.getElementById("s-error");
  var submitBtn = document.getElementById("s-submit");

  function fail(msg) {
    document.getElementById("lesson-title").textContent = "Link inválido";
    document.getElementById("lesson-date").textContent = "";
    var aviso = document.getElementById("s-notice");
    aviso.textContent = msg;
    aviso.classList.add("show");
    form.style.display = "none";
  }

  if (!token) {
    fail("Peça o link atualizado a alguém da diretoria.");
  } else {
    fetch("/api/event-signup/" + encodeURIComponent(token))
      .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
      .then(function (ev) {
        document.getElementById("event-kind").textContent = ev.kind || "Evento";
        document.getElementById("lesson-title").textContent = ev.title;
        var p = String(ev.date || "").split("-");
        var trajeto = ev.travelMinutes > 0 ? " (~" + ev.travelMinutes + " min do IME)" : "";
        var quando = [p.length === 3 ? p[2] + "/" + p[1] + "/" + p[0] : ""];
        if (ev.time) quando.push(ev.time);
        if (ev.location) quando.push(ev.location + trajeto);
        document.getElementById("lesson-date").textContent =
          quando.filter(Boolean).join(" · ") + (ev.open ? "" : " · inscrições encerradas");
        if (ev.text) document.getElementById("lesson-desc").textContent = ev.text;

        // As listas fechadas vêm do servidor: turma nova entra só no server.js.
        (ev.turmas || []).forEach(function (t) {
          var opt = document.createElement("option");
          opt.value = t; opt.textContent = t;
          document.getElementById("s-turma").appendChild(opt);
        });
        (ev.especialidades || []).forEach(function (e2) {
          var opt = document.createElement("option");
          opt.value = e2; opt.textContent = e2;
          document.getElementById("s-esp").appendChild(opt);
        });
        if (ev.location) document.getElementById("ack-local").textContent = ": " + ev.location + trajeto;
        if (ev.time) document.getElementById("ack-time").textContent = ": " + ev.time;
        // Vaga é informação de decisão: quem chega com a sala cheia precisa
        // saber que está entrando numa fila, não numa vaga.
        var seats = document.getElementById("seats");
        if (ev.capacity) {
          if (ev.seatsLeft > 0) {
            seats.textContent = ev.seatsLeft + " de " + ev.capacity + " vagas ainda disponíveis";
          } else {
            seats.textContent = "As " + ev.capacity + " vagas acabaram — você entra na fila de espera";
            seats.classList.add("full");
            submitBtn.textContent = "Entrar na fila de espera";
          }
        }
        if (!ev.open) {
          form.style.display = "none";
          var aviso = document.getElementById("s-notice");
          aviso.textContent = "As inscrições deste evento já foram encerradas.";
          aviso.classList.add("show");
        }
      })
      .catch(function () { fail("Este link não corresponde a nenhum evento."); });
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    errorEl.classList.remove("show");
    submitBtn.disabled = true;
    submitBtn.textContent = "Enviando...";
    fetch("/api/event-signup/" + encodeURIComponent(token), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        name: document.getElementById("s-name").value,
        email: document.getElementById("s-email").value,
        phone: document.getElementById("s-phone").value,
        turma: document.getElementById("s-turma").value,
        especialidade: document.getElementById("s-esp").value,
        idade: parseInt(document.getElementById("s-idade").value, 10),
        awareLocation: document.getElementById("s-aware-local").checked,
        awareTime: document.getElementById("s-aware-time").checked,
      }),
    })
      .then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
      .then(function (res) {
        if (res.ok) {
          form.style.display = "none";
          document.getElementById("seats").style.display = "none";
          document.getElementById("done").classList.add("show");
          if (res.data.status === "waitlist") {
            document.querySelector("#done h3").textContent = "Você está na fila";
            document.querySelector("#done .check").textContent = "…";
          }
          document.getElementById("done-msg").textContent = res.data.message || "Te esperamos lá!";
        } else {
          errorEl.textContent = res.data.message || "Não foi possível se inscrever. Tente de novo.";
          errorEl.classList.add("show");
          submitBtn.disabled = false;
          submitBtn.textContent = "Confirmar inscrição";
        }
      })
      .catch(function () {
        errorEl.textContent = "Erro de conexão. Tente de novo.";
        errorEl.classList.add("show");
        submitBtn.disabled = false;
        submitBtn.textContent = "Confirmar inscrição";
      });
  });
})();
</script>
<script src="/art.js"></script>
<script>LEPVArt.reveal();</script>
</body>
</html>
