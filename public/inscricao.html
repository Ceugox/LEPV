<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inscrição — LEPV</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/logo-liga.png">
<meta name="theme-color" content="#17171B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<style>
  body { background-color: var(--navy); min-height: 100vh; }
  .stage {
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 32px 16px; position: relative;
  }
  .stage::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image: linear-gradient(rgba(255,255,255,0.06) 1px, transparent 1px),
                       linear-gradient(90deg, rgba(255,255,255,0.06) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse 70% 60% at 50% 30%, black 0%, transparent 75%);
  }
  .brandblock { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 26px; }
  .brandblock img {
    width: 76px; height: 76px; margin-bottom: 16px; border-radius: 50%;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.18), 0 0 24px var(--red-glow);
  }
  .brandblock .eyebrow { color: rgba(255,255,255,0.55); margin-bottom: 10px; }
  .brandblock h1 {
    color: #fff; font-size: 32px; font-weight: 800; text-transform: uppercase;
    letter-spacing: 0.02em; line-height: 1; margin: 0;
  }
  .brandblock .sub { color: rgba(255,255,255,0.6); font-size: 13.5px; margin-top: 10px; }

  .card {
    position: relative; width: 100%; max-width: 420px; background: var(--white);
    border-radius: var(--radius-lg); padding: 28px 22px;
    box-shadow: var(--shadow-lift);
  }
  .card .eyebrow { margin-bottom: 6px; color: var(--graphite-soft); }
  .card h2 { font-size: 19px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.02em; color: var(--navy); margin: 0 0 4px; }
  .lesson-date { font-size: 13px; color: var(--graphite-soft); margin: 0 0 6px; }
  .lesson-desc { font-size: 13px; color: var(--graphite); line-height: 1.55; margin: 0 0 16px; }
  form { display: flex; flex-direction: column; gap: 16px; }
  .error {
    display: none; font-size: 12.5px; color: #991B1B; background: #FEEBEB;
    border: 1px solid #F5C6C6; border-radius: var(--radius-sm); padding: 9px 12px;
  }
  .error.show { display: block; }
  .btn-primary { width: 100%; margin-top: 4px; }
  .done { display: none; text-align: center; padding: 14px 4px 6px; }
  .done.show { display: block; }
  .done .check {
    width: 48px; height: 48px; margin: 0 auto 14px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--good-soft); color: var(--good); font-size: 22px; font-weight: 800;
  }
  .done h3 { font-size: 17px; font-weight: 800; text-transform: uppercase; color: var(--navy); margin: 0 0 8px; }
  .done p { font-size: 13px; color: var(--graphite-soft); line-height: 1.55; margin: 0; }
  .done .invite {
    margin-top: 14px; font-size: 13px; color: var(--navy); background: var(--pending-soft);
    border: 1px solid #F5DFB8; border-radius: var(--radius-sm); padding: 10px 12px; line-height: 1.5;
  }
  .done .invite a { color: var(--red-2); font-weight: 700; }
  .hint { font-size: 11.5px; color: var(--graphite-soft); margin-top: -6px; }
  .seats { font-size: 12.5px; font-weight: 700; color: var(--red); margin: 0 0 14px; }
  .seats.full { color: var(--pending); }
  .row2 { display: flex; gap: 12px; }
  .row2 .field { flex: 1; min-width: 0; }
  .ack {
    display: flex; align-items: flex-start; gap: 10px; font-size: 13px;
    color: var(--graphite); line-height: 1.45; cursor: pointer;
  }
  .ack input { width: 16px; height: 16px; margin-top: 1px; flex: none; accent-color: var(--red); }
  .ack strong { color: var(--navy); }
</style>
</head>
<body>
  <div class="stage">
    <div class="brandblock">
      <img src="/logo-liga.png" alt="LEPV" style="background:var(--white); object-fit:cover;">
      <p class="eyebrow">Liga de Empreendedorismo da Praia Vermelha</p>
      <h1>LEPV</h1>
      <p class="sub">Inscrição em atividade da liga</p>
    </div>

    <div class="card">
      <div id="lesson-info">
        <p class="eyebrow" id="event-kind">Evento</p>
        <h2 id="lesson-title">Carregando...</h2>
        <p class="lesson-date" id="lesson-date"></p>
        <p class="lesson-desc" id="lesson-desc"></p>
        <p class="seats" id="seats"></p>
        <!-- Fora do <form>: com as inscrições encerradas o formulário some e
             este aviso precisa continuar na tela. -->
        <p class="error" id="s-notice"></p>
      </div>

      <form id="signup-form">
        <div class="field">
          <label for="s-name">Nome completo</label>
          <input type="text" id="s-name" autocomplete="name" placeholder="Nome e sobrenome" required>
        </div>
        <div class="field">
          <label for="s-email">E-mail</label>
          <input type="email" id="s-email" autocomplete="email" placeholder="voce@exemplo.com" required>
        </div>
        <div class="field">
          <label for="s-phone">WhatsApp</label>
          <input type="tel" id="s-phone" autocomplete="tel" placeholder="(21) 9...." required>
        </div>
        <div class="row2">
          <div class="field">
            <label for="s-turma">Turma</label>
            <select id="s-turma" required><option value="">Selecione</option></select>
          </div>
          <div class="field">
            <label for="s-idade">Idade</label>
            <input type="number" id="s-idade" min="14" max="99" placeholder="Ex.: 20" required>
          </div>
        </div>
        <div class="field">
          <label for="s-esp">Especialidade</label>
          <select id="s-esp" required><option value="">Selecione</option></select>
        </div>
        <label class="ack">
          <input type="checkbox" id="s-aware-local" required>
          <span>Estou ciente do local<span id="ack-local"></span></span>
        </label>
        <label class="ack">
          <input type="checkbox" id="s-aware-time" required>
          <span>Estou ciente do horário<span id="ack-time"></span></span>
        </label>
        <p class="error" id="s-error"></p>
        <button type="submit" class="btn-primary" id="s-submit">Confirmar inscrição</button>
      </form>

      <div class="done" id="done">
        <div class="check">✓</div>
        <h3>Inscrição confirmada</h3>
        <p id="done-msg"></p>
        <div class="invite">
          Curte o que a LEPV faz? <a href="/login.html">Solicite seu acesso de membro</a> ou fale com a diretoria.
        </div>
      </div>
    </div>
  </div>

<script>
(function () {
  var token = new URLSearchParams(window.location.search).get("t") || "";
  var form = document.getElementById("signup-form");
  var errorEl = document.getElementById("s-error");
  var submitBtn = document.getElementById("s-submit");

  function fail(msg) {
    document.getElementById("lesson-title").textContent = "Link inválido";
    document.getElementById("lesson-date").textContent = "";
    var aviso = document.getElementById("s-notice");
    aviso.textContent = msg;
    aviso.classList.add("show");
    form.style.display = "none";
  }

  if (!token) {
    fail("Peça o link atualizado a alguém da diretoria.");
  } else {
    fetch("/api/event-signup/" + encodeURIComponent(token))
      .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
      .then(function (ev) {
        document.getElementById("event-kind").textContent = ev.kind || "Evento";
        document.getElementById("lesson-title").textContent = ev.title;
        var p = String(ev.date || "").split("-");
        var trajeto = ev.travelMinutes > 0 ? " (~" + ev.travelMinutes + " min do IME)" : "";
        var quando = [p.length === 3 ? p[2] + "/" + p[1] + "/" + p[0] : ""];
        if (ev.time) quando.push(ev.time);
        if (ev.location) quando.push(ev.location + trajeto);
        document.getElementById("lesson-date").textContent =
          quando.filter(Boolean).join(" · ") + (ev.open ? "" : " · inscrições encerradas");
        if (ev.text) document.getElementById("lesson-desc").textContent = ev.text;

        // As listas fechadas vêm do servidor: turma nova entra só no server.js.
        (ev.turmas || []).forEach(function (t) {
          var opt = document.createElement("option");
          opt.value = t; opt.textContent = t;
          document.getElementById("s-turma").appendChild(opt);
        });
        (ev.especialidades || []).forEach(function (e2) {
          var opt = document.createElement("option");
          opt.value = e2; opt.textContent = e2;
          document.getElementById("s-esp").appendChild(opt);
        });
        if (ev.location) document.getElementById("ack-local").textContent = ": " + ev.location + trajeto;
        if (ev.time) document.getElementById("ack-time").textContent = ": " + ev.time;
        // Vaga é informação de decisão: quem chega com a sala cheia precisa
        // saber que está entrando numa fila, não numa vaga.
        var seats = document.getElementById("seats");
        if (ev.capacity) {
          if (ev.seatsLeft > 0) {
            seats.textContent = ev.seatsLeft + " de " + ev.capacity + " vagas ainda disponíveis";
          } else {
            seats.textContent = "As " + ev.capacity + " vagas acabaram — você entra na fila de espera";
            seats.classList.add("full");
            submitBtn.textContent = "Entrar na fila de espera";
          }
        }
        if (!ev.open) {
          form.style.display = "none";
          var aviso = document.getElementById("s-notice");
          aviso.textContent = "As inscrições deste evento já foram encerradas.";
          aviso.classList.add("show");
        }
      })
      .catch(function () { fail("Este link não corresponde a nenhum evento."); });
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    errorEl.classList.remove("show");
    submitBtn.disabled = true;
    submitBtn.textContent = "Enviando...";
    fetch("/api/event-signup/" + encodeURIComponent(token), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        name: document.getElementById("s-name").value,
        email: document.getElementById("s-email").value,
        phone: document.getElementById("s-phone").value,
        turma: document.getElementById("s-turma").value,
        especialidade: document.getElementById("s-esp").value,
        idade: parseInt(document.getElementById("s-idade").value, 10),
        awareLocation: document.getElementById("s-aware-local").checked,
        awareTime: document.getElementById("s-aware-time").checked,
      }),
    })
      .then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
      .then(function (res) {
        if (res.ok) {
          form.style.display = "none";
          document.getElementById("seats").style.display = "none";
          document.getElementById("done").classList.add("show");
          if (res.data.status === "waitlist") {
            document.querySelector("#done h3").textContent = "Você está na fila";
            document.querySelector("#done .check").textContent = "…";
          }
          document.getElementById("done-msg").textContent = res.data.message || "Te esperamos lá!";
        } else {
          errorEl.textContent = res.data.message || "Não foi possível se inscrever. Tente de novo.";
          errorEl.classList.add("show");
          submitBtn.disabled = false;
          submitBtn.textContent = "Confirmar inscrição";
        }
      })
      .catch(function () {
        errorEl.textContent = "Erro de conexão. Tente de novo.";
        errorEl.classList.add("show");
        submitBtn.disabled = false;
        submitBtn.textContent = "Confirmar inscrição";
      });
  });
})();
</script>
</body>
</html>
