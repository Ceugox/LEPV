<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P1 · Memorando — LEPV área de membros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <div class="top-in">
    <img class="mark" src="../_assets/logo-mark.png" alt="LEPV">
    <div class="brand">
      <b>LEPV</b>
      <span>Liga de Empreendedorismo da Praia Vermelha</span>
    </div>
    <div class="who">
      <div class="pessoa">
        <img src="../_assets/members/3.png" alt="">
        <div><b>Clara Alencar</b><span>Presidente · turma XVII</span></div>
      </div>
      <button class="sair">Sair</button>
    </div>
  </div>
</header>

<nav class="tabs" aria-label="Seções">
  <div class="tabs-in" id="tabs"></div>
</nav>

<main>
  <section class="panel" data-panel="inicio"    id="p-inicio"></section>
  <section class="panel" data-panel="eventos"   id="p-eventos"></section>
  <section class="panel" data-panel="membros"   id="p-membros"></section>
  <section class="panel" data-panel="gastos"    id="p-gastos"></section>
  <section class="panel" data-panel="diretoria" id="p-diretoria"></section>
  <section class="panel" data-panel="acessos"   id="p-acessos"></section>
  <section class="panel" data-panel="legado"    id="p-legado"></section>
  <section class="panel" data-panel="empresas"  id="p-empresas"></section>
  <section class="panel" data-panel="selos"     id="p-selos"></section>
  <section class="panel" data-panel="roteiro"   id="p-roteiro"></section>
  <section class="panel" data-panel="missao"    id="p-missao"></section>
  <section class="panel" data-panel="arquivo"   id="p-arquivo"></section>

  <p class="foot-note">Proposta P1 · Memorando — a área de membros escrita na mesma gramática de documento da página pública: papel, tinta, vinho e filetes no lugar de cards quadrados.</p>
</main>

<script src="../_dados.js"></script>
<script src="render.js"></script>
<script src="../_tabs.js"></script>
</body>
</html>
