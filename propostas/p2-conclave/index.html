<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P2 · Conclave — LEPV área de membros</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="shell">
  <aside class="side">
    <div class="brandline">
      <span class="tile"><img src="../_assets/logo-mark.png" alt="LEPV"></span>
      <div><b>LEPV</b><span>Praia Vermelha</span></div>
    </div>
    <div id="nav"></div>
    <div class="who-side">
      <img src="../_assets/members/3.png" alt="">
      <div><b>Clara Alencar</b><span>Presidente</span></div>
      <button class="sair">Sair</button>
    </div>
  </aside>

  <main>
    <section class="panel" data-panel="inicio"    id="p-inicio"></section>
    <section class="panel" data-panel="eventos"   id="p-eventos"></section>
    <section class="panel" data-panel="membros"   id="p-membros"></section>
    <section class="panel" data-panel="gastos"    id="p-gastos"></section>
    <section class="panel" data-panel="diretoria" id="p-diretoria"></section>
    <section class="panel" data-panel="acessos"   id="p-acessos"></section>
    <section class="panel" data-panel="legado"    id="p-legado"></section>
    <section class="panel" data-panel="empresas"  id="p-empresas"></section>
    <section class="panel" data-panel="selos"     id="p-selos"></section>
    <section class="panel" data-panel="roteiro"   id="p-roteiro"></section>
    <section class="panel" data-panel="missao"    id="p-missao"></section>
    <section class="panel" data-panel="arquivo"   id="p-arquivo"></section>

    <p class="foot-note">Proposta P2 · Conclave — quente e humana: sidebar em creme, serif de sistema, terracota e cantos generosos. A logo vive num tile claro.</p>
  </main>
</div>

<script src="../_dados.js"></script>
<script src="render.js"></script>
<script src="../_tabs.js"></script>
</body>
</html>
